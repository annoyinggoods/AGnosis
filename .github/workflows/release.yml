name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve the package version
        id: ver
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The version is read from the `[package]` table ONLY: the
          # workspace table sits above it in Cargo.toml, and a
          # `[workspace.package]` table would carry a `version` key of
          # its own — a naive "the first `version =` line" grep would
          # pick the wrong one.
          if [ "${REF_TYPE}" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' | head -n 1)"
          fi
          if [ -z "${version}" ]; then
            echo "could not resolve the package version" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "building agnosis ${version}"

      # `-p agnosis`: the release ships the ROOT package's binary. The
      # workspace's default member is the root package too, so this is
      # the same build today — but naming the package keeps the release
      # from ever picking up a workspace member by accident.
      - name: Build the release binary
        run: cargo build --release --locked -p ducks

      # The release binary is a GUI-subsystem binary: the CLI verbs print
      # nothing by design, so the smoke test asserts that the selftest PNG
      # frames appeared on disk instead of looking at stdout.
      - name: Smoke Test (the selftest writes the PNG frames)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf selftest_out
          set +e
          ./target/release/agnosis.exe selftest --frames 2 --out ./selftest_out > selftest.log 2>&1
          code=$?
          set -e
          frames=0
          if [ -d selftest_out ]; then
            frames="$(find selftest_out -maxdepth 1 -name 'frame_*.png' | wc -l)"
          fi
          echo "selftest exit code ${code}, ${frames} PNG frames"
          cat selftest.log
          if [ "${frames}" -lt 2 ]; then
            echo "the selftest did not write the PNG frames" >&2
            exit 1
          fi
          if [ "${code}" -ne 0 ]; then
            echo "the selftest exited with ${code}" >&2
            exit 1
          fi

      - name: Stage the Windows package
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf stage
          mkdir -p stage
          cp target/release/agnosis.exe stage/agnosis.exe
