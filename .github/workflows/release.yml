          cat "${root}/DEBIAN/control"

      # The guard against a package that installs but will not start: every
      # shared library the binary links has to be named by the Depends line.
      - name: Assert the Depends line covers every linked library
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "ducks_${VERSION}/DEBIAN/control" <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          # soname -> the Debian package that ships it. ldd stays the source
          # of truth for the link-time dependencies; this map only names the
          # package. Anything not listed here is resolved with dpkg -S.
          SONAME_TO_PACKAGE = {
              "libc.so.6": "libc6",
              "libdl.so.2": "libc6",
              "libm.so.6": "libc6",
              "libpthread.so.0": "libc6",
              "librt.so.1": "libc6",
              "libresolv.so.2": "libc6",
              "libutil.so.1": "libc6",
              "libgcc_s.so.1": "libgcc-s1",
              "libasound.so.2": "libasound2",
              "libX11.so.6": "libx11-6",
              "libXext.so.6": "libxext6",
              "libXfixes.so.3": "libxfixes3",
              "libXcursor.so.1": "libxcursor1",
              "libXrandr.so.2": "libxrandr2",
              "libXi.so.6": "libxi6",
              "libXrender.so.1": "libxrender1",
              "libxcb.so.1": "libxcb1",
              "libxkbcommon.so.0": "libxkbcommon0",
              "libxkbcommon-x11.so.0": "libxkbcommon-x11-0",
              "libwayland-client.so.0": "libwayland-client0",
              "libwayland-server.so.0": "libwayland-server0",
              "libwayland-cursor.so.0": "libwayland-cursor0",
              "libwayland-egl.so.1": "libwayland-egl1",
              "libEGL.so.1": "libegl1",
              "libGL.so.1": "libgl1",
              "libGLX.so.0": "libglx0",
              "libvulkan.so.1": "libvulkan1",
          }

          # The kernel vDSO and the ELF loader are not packaged separately.
          IGNORE = {
              "linux-vdso.so.1",
              "ld-linux-x86-64.so.2",
              "ld-linux-aarch64.so.1",
              "ld64.so.1",
              "ld64.so.2",
              "ld-musl-x86_64.so.1",
          }

          def linked_sonames():
              done = subprocess.run(["ldd", "target/release/ducks"], capture_output=True, text=True)
              if done.returncode != 0:
                  sys.exit("ldd failed: " + done.stderr.strip())
              found = []
              for line in done.stdout.splitlines():
                  if "not found" in line:
                      sys.exit("a linked library is missing on the runner: " + line.strip())
                  fields = line.split("=>")[0].strip().split()
                  if not fields:
                      continue
                  name = os.path.basename(fields[0])
                  if ".so" not in name:
                      continue
                  found.append(name)
              return found

          def owning_packages(soname):
              mapped = SONAME_TO_PACKAGE.get(soname)
              if mapped:
                  return [mapped]
              probe = subprocess.run(["dpkg", "-S", "*/" + soname], capture_output=True, text=True)
              if probe.returncode != 0:
                  return []
              owners = []
              for line in probe.stdout.splitlines():
                  if ":" not in line:
                      continue
                  for part in line.rsplit(":", 1)[0].split(","):
                      name = part.strip().split(":")[0].strip()
                      if name:
                          owners.append(name)
              return owners

          def depends_packages(control_path):
              lines = control_path.read_text(encoding="utf-8").splitlines()
              for index, line in enumerate(lines):
                  if not line.lower().startswith("depends:"):
                      continue
                  parts = [line.split(":", 1)[1]]
                  for follow in lines[index + 1:]:
                      if follow[:1] in (" ", "\t"):
                          parts.append(follow.strip())
                      else:
                          break
                  names = set()
                  for part in " ".join(parts).split(","):
                      name = part.strip().split("(")[0].strip()
                      if name:
                          names.add(name)
                  return names
              return set()

          control_path = Path(sys.argv[1])
          if not control_path.is_file():
              sys.exit("missing " + str(control_path))
          declared = depends_packages(control_path)
          if not declared:
              sys.exit("DEBIAN/control has no Depends: line")

          missing = []
          unresolved = []
          for soname in sorted(set(linked_sonames())):
              if soname in IGNORE:
                  continue
              owners = owning_packages(soname)
              if not owners:
                  unresolved.append(soname)
              elif not any(owner in declared for owner in owners):
                  missing.append(soname + " (" + ", ".join(owners) + ")")
          if unresolved:
              sys.exit("no Debian package found for: " + ", ".join(unresolved))
          if missing:
              sys.exit("DEBIAN/control Depends: is missing: " + ", ".join(missing))
          print("Depends: covers every linked library")
          PY
          # The link-time closure is not the whole dependency set: winit is
          # built with the `x11-dl` feature, so libX11, libXcursor,
          # libXrandr, libXi, libXfixes and libxkbcommon-x11 are dlopened
          # at runtime and `ldd` never reports them. The X11 runtime
          # packages are listed by hand and checked on their own: without
          # them the package installs and then fails to start.
          python3 - "ducks_${VERSION}/DEBIAN/control" <<'PY'
          import sys
          from pathlib import Path

          # The Debian packages that ship the X11 libraries winit dlopens
          # at runtime. `ldd` cannot see these, so they are asserted here.
          REQUIRED_X11_PACKAGES = [
              "libx11-6",
              "libxcb1",
              "libxext6",
              "libxfixes3",
              "libxcursor1",
              "libxi6",
              "libxkbcommon0",
              "libxkbcommon-x11-0",
              "libxrandr2",
          ]

          def depends_packages(control_path):
              lines = control_path.read_text(encoding="utf-8").splitlines()
              for index, line in enumerate(lines):
                  if not line.lower().startswith("depends:"):
                      continue
                  parts = [line.split(":", 1)[1]]
                  for follow in lines[index + 1:]:
                      if follow[:1] in (" ", "\t"):
                          parts.append(follow.strip())
                      else:
                          break
                  names = set()
                  for part in " ".join(parts).split(","):
                      name = part.strip().split("(")[0].strip()
                      if name:
                          names.add(name)
                  return names
              return set()

          control_path = Path(sys.argv[1])
          if not control_path.is_file():
              sys.exit("missing " + str(control_path))
          declared = depends_packages(control_path)
          if not declared:
              sys.exit("DEBIAN/control has no Depends: line")
          missing = [name for name in REQUIRED_X11_PACKAGES if name not in declared]
          if missing:
              sys.exit(
                  "DEBIAN/control Depends: is missing the X11 runtime package(s): "
                  + ", ".join(missing)
              )
          print("Depends: names every X11 runtime package")
          PY

      - name: Build the deb
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          dpkg-deb --build --root-owner-group "ducks_${VERSION}" "ducks_${VERSION}_amd64.deb"
          dpkg-deb --info "ducks_${VERSION}_amd64.deb"
          dpkg-deb --contents "ducks_${VERSION}_amd64.deb"

      - name: Upload the Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ducks-linux-amd64
          path: ducks_${{ steps.ver.outputs.version }}_amd64.deb
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the package version
        id: ver
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The version is read from the `[package]` table ONLY: the
          # workspace table sits above it in Cargo.toml, and a
          # `[workspace.package]` table would carry a `version` key of
          # its own — a naive "the first `version =` line" grep would
          # pick the wrong one.
          if [ "${REF_TYPE}" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' | head -n 1)"
          fi
          if [ -z "${version}" ]; then
            echo "could not resolve the package version" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check the packages
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "ducks-${VERSION}-windows-x64.zip"
            "ducks-${VERSION}-macos-universal.dmg"
            "ducks_${VERSION}_amd64.deb"
          )
          for name in "${expected[@]}"; do
            if [ ! -f "dist/${name}" ]; then
              echo "missing artifact: ${name}" >&2
              ls -la dist >&2
              exit 1
            fi
          done
          count="$(find dist -maxdepth 1 -type f | wc -l)"
          if [ "${count}" -ne 3 ]; then
            echo "expected exactly three artifacts, found ${count}" >&2
            ls -la dist >&2
            exit 1
          fi
          ls -la dist

      - name: Publish to the GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* --verify-tag --generate-notes --title "${TAG}"
          fi

      - name: Note (dispatched by hand, so no release is published)
        if: github.ref_type != 'tag'
        run: |
          echo "The workflow was dispatched by hand: the packages are attached to this run, but no GitHub release was created."
