      - name: Pack the Windows zip
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $zip = "ducks-$env:VERSION-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "stage/*" -DestinationPath $zip
          Write-Host "packed $zip"

      - name: Upload the Windows package
        uses: actions/upload-artifact@v4
        with:
          name: agnosis-windows-x64
          path: ducks-${{ steps.ver.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS package
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Both slices of the universal binary need their own std, so the
      # targets are installed explicitly: a bare `stable` toolchain only
      # carries the host target.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Resolve the package version
        id: ver
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The version is read from the `[package]` table ONLY: the
          # workspace table sits above it in Cargo.toml, and a
          # `[workspace.package]` table would carry a `version` key of
          # its own — a naive "the first `version =` line" grep would
          # pick the wrong one.
          if [ "${REF_TYPE}" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' | head -n 1)"
          fi
          if [ -z "${version}" ]; then
            echo "could not resolve the package version" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "building agnosis ${version}"

      - name: Build both architectures
        run: |
          cargo build --release --locked -p agnosis --target aarch64-apple-darwin
          cargo build --release --locked -p agnosis --target x86_64-apple-darwin

      - name: Assemble the app bundle
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf agnosis.app
          mkdir -p agnosis.app/Contents/MacOS agnosis.app/Contents/Resources
          lipo -create -output agnosis.app/Contents/MacOS/ducks \
            target/aarch64-apple-darwin/release/ducks \
            target/x86_64-apple-darwin/release/ducks
          cp packaging/macos/Info.plist agnosis.app/Contents/Info.plist
          lipo -info agnosis.app/Contents/MacOS/ducks

      # The bundle version follows the crate version, so the shipped app never
      # carries a stale CFBundleVersion.
      - name: Stamp the bundle version
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 - packaging/macos/Info.plist agnosis.app/Contents/Info.plist "${VERSION}" <<'PY'
          import re
          import sys

          source, destination, version = sys.argv[1], sys.argv[2], sys.argv[3]
          text = open(source, encoding="utf-8").read()
          for key in ("CFBundleShortVersionString", "CFBundleVersion"):
              pattern = r"(<key>" + key + r"</key>\s*<string>)([^<]*)(</string>)"
              text, hits = re.subn(pattern, lambda match: match.group(1) + version + match.group(3), text)
              if hits != 1:
                  sys.exit("expected exactly one " + key + " entry, found " + str(hits))
          open(destination, "w", encoding="utf-8").write(text)
          print("bundle version " + version)
          PY

      - name: Smoke Test (the selftest writes the PNG frames)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf selftest_out
          ./agnosis.app/Contents/MacOS/ducks selftest --frames 2 --out ./selftest_out
          frames="$(find selftest_out -maxdepth 1 -name 'frame_*.png' | wc -l)"
          echo "selftest wrote ${frames} PNG frames"
          if [ "${frames}" -lt 2 ]; then
            echo "the selftest did not write the PNG frames" >&2
            exit 1
          fi

      # `hdiutil create -srcfolder` copies the *contents* of the folder into
      # the image root, so the bundle is staged inside a directory that is
      # handed to -srcfolder: the mounted volume then holds `agnosis.app`
      # instead of the bundle's inner `Contents` directory.
      - name: Build the disk image
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf dmgroot dmgmount
          mkdir -p dmgroot
          cp -R agnosis.app dmgroot/agnosis.app
          rm -f "ducks-${VERSION}-macos-universal.dmg"
          hdiutil create -volname ducks -srcfolder dmgroot -ov -format UDZO "ducks-${VERSION}-macos-universal.dmg"
          hdiutil verify "ducks-${VERSION}-macos-universal.dmg"

      - name: Verify the disk image holds the app bundle
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dmgmount
          hdiutil attach -nobrowse -noautoopen -readonly -mountpoint "${PWD}/dmgmount" "ducks-${VERSION}-macos-universal.dmg"
          if [ ! -d "dmgmount/agnosis.app" ]; then
            echo "the disk image does not hold agnosis.app at its root" >&2
            ls -la dmgmount >&2
            hdiutil detach "${PWD}/dmgmount" || true
            exit 1
          fi
          hdiutil detach "${PWD}/dmgmount"

      - name: Upload the macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ducks-macos-universal
          path: ducks-${{ steps.ver.outputs.version }}-macos-universal.dmg
          if-no-files-found: error

  linux:
    name: Linux package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxfixes-dev libasound2-dev dpkg-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve the package version
        id: ver
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The version is read from the `[package]` table ONLY: the
          # workspace table sits above it in Cargo.toml, and a
          # `[workspace.package]` table would carry a `version` key of
          # its own — a naive "the first `version =` line" grep would
          # pick the wrong one.
          if [ "${REF_TYPE}" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' | head -n 1)"
          fi
          if [ -z "${version}" ]; then
            echo "could not resolve the package version" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "building agnosis ${version}"

      # `-p agnosis`: the release ships the ROOT package's binary. The
      # workspace's default member is the root package too, so this is
      # the same build today — but naming the package keeps the release
      # from ever picking up a workspace member by accident.
      - name: Build the release binary
        run: cargo build --release --locked -p ducks

      - name: Smoke Test (the selftest writes the PNG frames)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf selftest_out
          ./target/release/agnosis selftest --frames 2 --out ./selftest_out
          frames="$(find selftest_out -maxdepth 1 -name 'frame_*.png' | wc -l)"
          echo "selftest wrote ${frames} PNG frames"
          if [ "${frames}" -lt 2 ]; then
            echo "the selftest did not write the PNG frames" >&2
            exit 1
          fi

      - name: Assemble the package tree
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          root="ducks_${VERSION}"
          rm -rf "${root}"
          mkdir -p "${root}/DEBIAN" "${root}/usr/bin" "${root}/usr/share/applications" "${root}/usr/share/doc/ducks"
          cp target/release/agnosis "${root}/usr/bin/ducks"
          cp packaging/linux/ducks.desktop "${root}/usr/share/applications/ducks.desktop"
          cp README.md "${root}/usr/share/doc/ducks/README.md"
          cat > "${root}/usr/share/doc/ducks/copyright" <<'EOF'
